[project]
name = "bitright"
version = "0.2.0"
description = "Modernized BitRights teaching demo retaining the original media matching algorithms"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask>=3.1,<4",
  "image-match==1.1.2",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "py-tlsh==5.0.0",
  "pyacoustid>=1.3,<2",
  "requests>=2.32,<3",
  "scikit-image>=0.25,<0.27",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# image-match 1.1.2 pins scikit-image to 2016; the compatibility adapter is tested.
override-dependencies = ["scikit-image>=0.25,<0.27"]
